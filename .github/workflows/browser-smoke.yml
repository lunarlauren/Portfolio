name: Portfolio browser smoke tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check UX content, delivery status, and component contracts
        run: node scripts/check-content.mjs
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          # GitHub-hosted Ubuntu has Chromium runtime libraries; avoid the
          # unreliable apt mirror refresh triggered by --with-deps.
          npx playwright install chromium
      - name: Check JavaScript syntax
        run: |
          node --check public/script.js
          node --check public/components/case-study.js
          node --check public/components/project-content.js
          node --check public/content.js
      - name: Test navigation in Chromium
        run: node tests/smoke.mjs
